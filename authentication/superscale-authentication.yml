downstream_platform_auth:
  note: >-
    Separate from Superscale's own auth: the product connects to Meta Ads,
    Google Ads, TikTok Ads, Shopify, Google Analytics, Instagram and Slack over
    each platform's own OAuth. Superscale documents that users authorize from
    the platform's own login, never share a password, and can revoke access from
    the platform; read and write permissions are requested separately, and
    spend- or delivery-changing write actions are approval-gated inside
