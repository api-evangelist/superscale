source: >-
  live introspection of https://docs.superscale.ai/mcp, the 401 challenge from
  https://mcp.superscale.ai/mcp, and https://docs.superscale.ai/integrations/capabilities
note: >-
  Superscale has no REST API, so the usual REST conventions (pagination,
  sparse fields, expansion, request-id tracing, URI versioning) have no
  surface to describe. What it does have is an agent-protocol contract, and
  that is what is captured here. Nothing in this file is inferred from an
  OpenAPI document, because none exists.
