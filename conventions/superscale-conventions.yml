approval_gating:
  documented: true
  source: https://docs.superscale.ai/integrations/capabilities
  detail: >-
    The most consequential convention Superscale actually publishes. Any action
    that starts, pauses, resumes, archives or removes ad delivery, changes a
    budget, or replaces live creative is a blocking human approval checkpoint
    before the downstream platform API call is made. Approval cards show
    platform, action, description and fields; they run one at a time; a declined
    or failed later step does NOT roll back earlier approved steps. Meta and
    Google creation steps default to paused. This is a human-in-the-loop
    contract an agent integrator must plan around: an approved MCP call can
    block on a human indefinitely, and partial failure is non-transactional.
  agent_relevance: high
metering:
  unit: credit
  detail: >-
    Every metered action costs credits and the app displays the cost before
    execution. Agent message 1 credit; report 10; Agent static 30; Agent
    Seedance video from 500. Failed generations return pending credits
    automatically. Pools are spent in order: free, trial, subscription, top-up,
    then bonus/promotional.
  source: https://docs.superscale.ai/billing/how-credits-work
