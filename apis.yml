aid: superscale
name: Superscale
description: >-
  Superscale is an autonomous AI marketing agent for performance advertising. A
  user gives it a product URL (App Store, Shopify, website, or Lovable project)
  and a brief; the agent then researches competitor ads in the niche, writes copy
  and scripts, produces AI UGC videos and static image ads, adds captions and
  finishing touches, resizes every asset to the required aspect ratios, and —
  where ad accounts are connected — builds and publishes campaigns on Meta,
  Google and TikTok behind a blocking human approval step. It serves mobile-app
  marketers, e-commerce brands, SaaS companies, agencies and growth teams.
  Superscale is Europe-based and backed by Interface Capital, S16VC, Creandum,
  Lovable and ElevenLabs. Its machine-readable surface is agent-native rather
  than REST: an OAuth-gated Model Context Protocol server at mcp.superscale.ai
  (included from the Pro plan upward), an anonymous documentation MCP server, a
  conformant A2A agent card, and a published Agent Skill — with no OpenAPI.
