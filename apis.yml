apis:
- name: Superscale MCP Server
  description: >-
    The product Model Context Protocol server. Lets an external agent runtime
    (Claude and similar MCP clients) drive Superscale's creative engine —
    generating statics, UGC video and scripts from context the calling agent
    supplies, reading live performance from connected Meta, TikTok and Google Ads
    accounts, and running competitive research — then schedule those jobs on a
    cadence. Live and OAuth-gated: an unauthenticated call returns HTTP 401 with
    an RFC 9728 WWW-Authenticate challenge naming its protected-resource
    metadata. Included from the Pro plan upward. Tool schemas require an
    authenticated session and are therefore not captured.
  humanURL: https://docs.superscale.ai/integrations/superscale-for-agents
  baseURL: https://mcp.superscale.ai/mcp
  image: https://superscale.ai/images/og-images/default-og-image.jpg
  tags:
  - MCP
  - Agents
  - Advertising
  - Creative Generation
  properties:
  - type: MCPServer
    url: mcp/superscale-mcp.yml
  - type: Authentication
    url: authentication/superscale-authentication.yml
  - type: OAuthScopes
    url: scopes/superscale-scopes.yml
- name: Superscale Documentation MCP Server
  description: >-
    An anonymous Model Context Protocol server served from Superscale's own
    documentation host, providing search and retrieval over the published
    Superscale knowledge base. Introspected live on 2026-08-12: MCP protocol
    version 2025-06-18, serverInfo "Superscale" 1.0.0, three tools with real
    JSON Schema input schemas (search_superscale, query_docs_filesystem_superscale,
    submit_feedback). Read-only apart from docs feedback. Provided by the
    Mintlify documentation platform and declared in Superscale's own
    /.well-known/mcp.json.
  humanURL: https://docs.superscale.ai/
  baseURL: https://docs.superscale.ai/mcp
  image: https://superscale.ai/images/og-images/default-og-image.jpg
  tags:
  - MCP
  - Documentation
  - Search
  properties:
  - type: MCPServer
    url: mcp/superscale-mcp.yml
