# ---- superscale.ai / app.superscale.ai — SPA catch-all, one real file ----
- host: https://superscale.ai
  path: /.well-known/security.txt
  status: 200
  content_type: text/plain
  real: true
  kind: RFC 9116 security.txt
  file: superscale-security.txt
  note: >-
    Also served identically from https://app.superscale.ai. EXPIRED — the
    Expires field is 2026-08-08T23:59:00.000Z, four days before this probe
    (2026-08-12). RFC 9116 says a security.txt past its Expires date should
    not be relied upon. The contact address itself still resolves and is
    recorded in security/superscale-vulnerability-disclosure.yml.
