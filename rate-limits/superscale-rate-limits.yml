headers: []
headers_note: >-
  NO runtime rate-limit signal is published or observable. No RateLimit-*,
  X-RateLimit-* or Retry-After header appeared on any response from
  superscale.ai, docs.superscale.ai or mcp.superscale.ai, and the full 340KB
  docs corpus contains zero occurrences of "rate limit", "throttle", "429" or
  "concurrency". An agent integrating the MCP server has no way to learn its
  remaining headroom from a response — it can only read the credit balance in
  the app UI. This is the single largest agent-readiness gap on the surface.
exhaustion_status: null
exhaustion_note: >-
  The HTTP status returned when a workspace runs out of credits mid-call is not
  documented and could not be observed anonymously (the product MCP server is
  OAuth-gated).
model: quota
model_note: >-
  Superscale meters by CREDIT QUOTA per billing period, not by request rate.
  The limits below are the published, plan-attached quotas — real provider
  numbers, but monthly budgets rather than per-window request ceilings.
