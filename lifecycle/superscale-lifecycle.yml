notes: >-
  Operational transparency is genuinely good for a company this young: a live
  status page, a well-maintained dated changelog that even names the underlying
  models, and an in-product support channel. What is missing is everything that
  makes a surface safe to build against over time — no versioning policy, no
  deprecation policy, no public SLA, and a security.txt that expired on
  2026-08-08.
